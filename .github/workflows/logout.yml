name: Build, Push, and Deploy logout Microservice

on:
  push:
    branches:
      - feat/user-management
    paths:
      - "User_management/backend/logout/**"
      - ".github/workflows/logout.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAMEJ }}
          password: ${{ secrets.DOCKER_PASSWORDJ }}

      - name: Build logout Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAMEJ }}/logout:latest ./User_management/backend/logout

      - name: Push logout Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAMEJ }}/logout:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEYJ }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-34-238-135-69.compute-1.amazonaws.com << 'EOF'
            if ! command -v docker &> /dev/null
            then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            sudo docker pull ${{ secrets.DOCKER_USERNAMEJ }}/logout:latest
            sudo docker stop logout || true
            sudo docker rm logout || true

            sudo docker run -d -p 3001:3000 --name logout ${{ secrets.DOCKER_USERNAMEJ }}/logout:latest
          EOF
