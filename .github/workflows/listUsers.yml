name: Build, Push, and Deploy Docker Image listUsers

on:
  push:
    branches:
      - feat/user-management

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAMEJ }}
          password: ${{ secrets.DOCKER_PASSWORDJ }}

      - name: Build listUsers Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest ./User_management/backend/listUsers

      - name: Push listUsers Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEYJ }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-35-174-4-131.compute-1.amazonaws.com << 'EOF'
            if ! command -v docker &> /dev/null
            then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            
            sudo docker pull ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest

            # Stop and remove the existing container if it exists
            if [ "$(sudo docker ps -aq -f name=listusers)" ]; then
            sudo docker stop listusers
            sudo docker rm listusers
            fi

            # Run the new container with environment variables
            sudo docker run -d \
              --name listusers \
              -e DB_HOST=${{ secrets.DB_HOSTJ }} \
              -e DB_USER=${{ secrets.DB_USERJ }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORDJ }} \
              -e DB_NAME=${{ secrets.DB_NAMEJ }} \
              -p 4567:4567 \
              ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest
          EOF
