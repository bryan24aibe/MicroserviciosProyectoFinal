name: Build, Push, and Deploy Docker Image listUsers

on:
  push:
    branches:
      - feat/user-management
    paths:
      - 'User_management/backend/listUsers/**'
      - '.github/workflows/listUsers.yml'


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAMEJ }}
          password: ${{ secrets.DOCKER_PASSWORDJ }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest ./User_management/backend/listUsers
          docker push ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEYJ }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-34-238-135-69.compute-1.amazonaws.com << 'EOF'
            # Ensure Docker is installed and running
            if ! command -v docker &> /dev/null; then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Pull the latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest

            # Stop and remove existing container safely
            sudo docker stop listusers || true
            sudo docker rm listusers || true

            # Run the container with clean environment variables
            sudo docker run -d --name listusers \
              -p 4567:4567 \
              --env "DB_HOST=$(echo '${{ secrets.DB_HOSTJ }}' | tr -d '\n')" \
              --env "DB_USER=$(echo '${{ secrets.DB_USERJ }}' | tr -d '\n')" \
              --env "DB_PASSWORD=$(echo '${{ secrets.DB_PASSWORDJ }}' | tr -d '\n')" \
              --env "DB_NAME=$(echo '${{ secrets.DB_NAMEJ }}' | tr -d '\n')" \
              ${{ secrets.DOCKER_USERNAMEJ }}/listusers:latest
          EOF