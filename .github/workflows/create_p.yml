name: Build, Push to Docker Hub, and Deploy to EC2

on:
  push:
    paths:
      - "create_producto/**"  # Solo ejecuta el workflow si hay cambios en este directorio
    branches: ["test_yml"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Configura el repositorio
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Inicia sesión en Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Construye la imagen de Docker
    - name: Build Docker image
      run: |
        docker build create_producto/. --file create_producto/Dockerfile \
        --tag ${{ secrets.DOCKER_USERNAME }}/create_producto:latest \
        --build-arg MONGODB_URI=${{ secrets.MONGODB_URI }} \
        --build-arg MONGODB_DB=${{ secrets.MONGODB_DB }} \
        --build-arg PORT=${{ secrets.PORT }}

    # 4. Sube la imagen al registro de Docker Hub
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/create_producto:latest

    # 5. Desplegar en EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Detener y eliminar cualquier contenedor existente
          sudo docker stop create_producto || true
          sudo docker rm create_producto || true

          # Descargar la nueva imagen desde Docker Hub
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/create_producto:latest

          # Ejecutar el contenedor en el puerto 80
          sudo docker run -d \
            --name create_producto \
            -p 80:${{ secrets.PORT }} \
            -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
            -e MONGODB_DB=${{ secrets.MONGODB_DB }} \
            -e PORT=${{ secrets.PORT }} \
            ${{ secrets.DOCKER_USERNAME }}/create_producto:latest
