name: 🚀 Deploy Filtrado y Búsqueda Service to AWS

on:
  push:
    paths:
      - "Gestion_Producto/filtrado_busqueda/**"
    branches:
      - QA

jobs:
  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 📦 Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/filtrado_busqueda:latest \
            -f filtrado_busqueda/Dockerfile filtrado_busqueda \
            --build-arg MONGO_URI=${{ secrets.MONGO_URI }} \
            --build-arg DB_NAME=${{ secrets.DB_NAME }} \
            --build-arg PORT=${{ secrets.PORT5 }}
          docker push ${{ secrets.DOCKER_USERNAME }}/filtrado_busqueda:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: 🚀 Connect to EC2 and Deploy Filtrado y Búsqueda Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST5 }}
          username: ${{ secrets.EC2_USERNAME5 }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🔍 Checking if Docker is installed..."
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker $USER
            fi

            echo "🛑 Stopping and removing previous container..."
            sudo docker stop filtrado_busqueda || true
            sudo docker rm filtrado_busqueda || true

            echo "🧹 Removing old Docker images..."
            sudo docker image prune -af

            echo "📥 Pulling the latest Docker image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/filtrado_busqueda:latest

            echo "🚀 Running the new container..."
            sudo docker run -d \
              --name filtrado_busqueda \
              -p 4000:${{ secrets.PORT5 }} \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e PORT=${{ secrets.PORT5 }} \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/filtrado_busqueda:latest

            echo "🔍 Verifying deployment..."
            if sudo docker ps -f name=filtrado_busqueda | grep filtrado_busqueda; then
              echo "✅ Deployment successful: filtrado_busqueda Service is running."
            else
              echo "❌ Deployment failed: Check logs for errors."
              exit 1
            fi

      - name: 🔐 Log out of Docker Hub
        run: docker logout
