name: Build, Push to Docker Hub, and Deploy to EC2

on:
  push:
    paths:
      - "FiltradoyBusqueda/**"  # Solo ejecuta el workflow si hay cambios en este directorio
    branches: ["main"]  # Cambia esta rama a la que usas en tu repositorio

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Iniciar sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Construir la imagen Docker
      - name: Build Docker image
        run: |
          docker build FiltradoyBusqueda/. --file FiltradoyBusqueda/Dockerfile \
          --tag ${{ secrets.DOCKER_USERNAME }}/filtradoybusqueda:latest \
          --build-arg MONGO_URI=${{ secrets.MONGO_URI }} \
          --build-arg DB_NAME=${{ secrets.DB_NAME }} \
          --build-arg PORT=${{ secrets.PORT }}

      # 4. Subir la imagen a Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/filtradoybusqueda:latest

      # 5. Desplegar en EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME5 }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Instalar Docker si no está instalado
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker"
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker ec2-user
            fi
            # Detener y eliminar cualquier contenedor existente
            sudo docker stop filtradoybusqueda || true
            sudo docker rm filtradoybusqueda || true
            # Descargar la nueva imagen desde Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/filtradoybusqueda:latest
            # Ejecutar el contenedor en el puerto 4000
            sudo docker run -d \
              --name filtradoybusqueda \
              -p 4000:${{ secrets.PORT5 }} \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e PORT=${{ secrets.PORT }} \
              ${{ secrets.DOCKER_USERNAME }}/filtradoybusqueda:latest
