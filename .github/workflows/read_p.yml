name: 🚀 Deploy Read Service to AWS

on:
  push:
    paths:
      - "Gestion_Producto/read_service/**"
    branches:
      - QA

jobs:
  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 📦 Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/read_service:latest \
            -f read_service/Dockerfile read_service \
            --build-arg MONGODB_URI=${{ secrets.MONGODB_URI }} \
            --build-arg MONGODB_DB=${{ secrets.MONGODB_DB }} \
            --build-arg PORT=${{ secrets.PORT3 }}
          docker push ${{ secrets.DOCKER_USERNAME }}/read_service:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: 🚀 Connect to EC2 and Deploy Read Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST3 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🔍 Checking if Docker is installed..."
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            echo "🛑 Stopping and removing previous container..."
            sudo docker stop read_service || true
            sudo docker rm read_service || true

            echo "🧹 Removing old Docker images..."
            sudo docker image prune -af

            echo "📥 Pulling the latest Docker image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/read_service:latest

            echo "🚀 Running the new container..."
            sudo docker run -d \
              --name read_service \
              -p 80:${{ secrets.PORT3 }} \
              -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
              -e MONGODB_DB=${{ secrets.MONGODB_DB }} \
              -e PORT=${{ secrets.PORT3 }} \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/read_service:latest

            echo "🔍 Verifying deployment..."
            if sudo docker ps -f name=read_service | grep read_service; then
              echo "✅ Deployment successful: Read Service is running."
            else
              echo "❌ Deployment failed: Check logs for errors."
              exit 1
            fi

      - name: 🔐 Log out of Docker Hub
        run: docker logout
