name: Build, Push, and Deploy Docker Image PwdRecover

on:
  push:
    branches:
      - feat/user-management
    paths:
      - 'User_management/backend/PwdRecover/**'
      - '.github/workflows/PwdRecover.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAMEJ }}
          password: ${{ secrets.DOCKER_PASSWORDJ }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAMEJ }}/pwdrecover:latest ./User_management/backend/PwdRecover
          docker push ${{ secrets.DOCKER_USERNAMEJ }}/pwdrecover:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEYJ }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-44-205-135-240.compute-1.amazonaws.com << 'EOF'
            # Actualizar el sistema y asegurarse de que Docker está instalado
            sudo dnf update -y
            if ! command -v docker &> /dev/null; then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Crear la red personalizada para los contenedores
            docker network create --driver bridge app-network

            # Descargar la imagen de Redis si no está presente
            if ! docker images | grep -q redis; then
              sudo docker pull redis:latest
            fi

            # Iniciar Redis en la red personalizada
            if ! docker ps | grep -q redis-server; then
              sudo docker run -d --name redis-server \
                -p 6379:6379 \
                --network app-network \
                --restart unless-stopped \
                redis:latest
            fi

            # Descargar la imagen más reciente de pwdrecover
            sudo docker pull ${{ secrets.DOCKER_USERNAMEJ }}/pwdrecover:latest

            # Detener y eliminar cualquier contenedor previo de pwdrecover
            sudo docker stop pwdrecover || true
            sudo docker rm pwdrecover || true

            # Ejecutar pwdrecover con las variables de entorno necesarias
            sudo docker run -d --name pwdrecover \
              -p 8080:8080 \
              --network app-network \
              --env "DB_HOST=$(echo '${{ secrets.DB_HOSTJ }}' | tr -d '\n')" \
              --env "DB_USER=$(echo '${{ secrets.DB_USERJ }}' | tr -d '\n')" \
              --env "DB_PASSWORD=$(echo '${{ secrets.DB_PASSWORDJ }}' | tr -d '\n')" \
              --env "DB_NAME=$(echo '${{ secrets.DB_NAMEJ }}' | tr -d '\n')" \
              --env "DB_redisHOST=redis-server:6379" \
              ${{ secrets.DOCKER_USERNAMEJ }}/pwdrecover:latest
          EOF
