name: Build, Push, and Deploy Singup(corregido) Microservice.

on:
  push:
    branches:
      - feat/user-management
    paths:
      - 'User_management/backend/singup/**'
      - '.github/workflows/Singup'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAMEJ }}
          password: ${{ secrets.DOCKER_PASSWORDJ }}

      - name: Build Singup Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAMEJ }}/singup:latest ./User_management/backend/singup

      - name: Push Singup Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAMEJ }}/singup:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEYJ }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-52-91-206-110.compute-1.amazonaws.com << 'EOF'
            if ! command -v docker &> /dev/null
            then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            sudo docker pull ${{ secrets.DOCKER_USERNAMEJ }}/singup:latest
            sudo docker stop $(sudo docker ps -q) || true
            sudo docker rm -f $(sudo docker ps -aq) || true
            sudo docker run -d -p 3002:3000 \
              --name singup \
              --env "DB_HOST=$(echo '${{ secrets.DB_HOSTJ }}' | tr -d '\n')" \
              --env "DB_USER=$(echo '${{ secrets.DB_USERJ }}' | tr -d '\n')" \
              --env "DB_PASSWORD=$(echo '${{ secrets.DB_PASSWORDJ }}' | tr -d '\n')" \
              --env "DB_NAME=$(echo '${{ secrets.DB_NAMEJ }}' | tr -d '\n')" \
              ${{ secrets.DOCKER_USERNAMEJ }}/singup:latest
          EOF
