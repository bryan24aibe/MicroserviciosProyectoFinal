name: 🚀 Deploy Inventory Realtime Service to AWS

on:
  push:
    paths:
      - "inventory-realtime/**"
    branches:
      - QA

jobs:
  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 📦 Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest \
            -f inventory-realtime/Dockerfile inventory-realtime \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
            --build-arg DYNAMODB_TABLE=${{ secrets.DYNAMODB_TABLE }} \
            --build-arg PORT=${{ secrets.PORT6 }}
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: 🚀 Connect to EC2 and Deploy Inventory Realtime Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST7 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🔍 Checking if Docker is installed..."
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker $USER
            fi

            echo "🛑 Stopping and removing previous container..."
            sudo docker stop inventory-realtime || true
            sudo docker rm inventory-realtime || true

            echo "🧹 Removing old Docker images..."
            sudo docker image prune -af

            echo "📥 Pulling the latest Docker image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest

            echo "🚀 Running the new container..."
            sudo docker run -d \
              --name inventory-realtime \
              -p 80:${{ secrets.PORT7 }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e DYNAMODB_TABLE=${{ secrets.DYNAMODB_TABLE }} \
              -e PORT=${{ secrets.PORT6 }} \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest

            echo "🔍 Verifying deployment..."
            if sudo docker ps -f name=inventory-realtime | grep inventory-realtime; then
              echo "✅ Deployment successful: Inventory Realtime Service is running."
            else
              echo "❌ Deployment failed: Check logs for errors."
              exit 1
            fi

      - name: 🔐 Log out of Docker Hub
        run: docker logout
