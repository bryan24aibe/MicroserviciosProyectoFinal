name: Build, Push to Docker Hub, and Deploy to EC2

on:
  push:
    paths:
      - "inventory-realtime/**"  # Solo ejecuta el workflow si hay cambios en este directorio
    branches: ["main"]  # Cambia esta rama a la que usas en tu repositorio

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Configura el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Inicia sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Construir la imagen de Docker
      - name: Build Docker image
        run: |
          docker build inventory-realtime/. --file inventory-realtime/Dockerfile \
          --tag ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest \
          --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
          --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
          --build-arg DYNAMODB_TABLE=${{ secrets.DYNAMODB_TABLE }} \
          --build-arg PORT=${{ secrets.PORT }}

      # 4. Subir la imagen al registro de Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest

      # 5. Desplegar en EC2
      - name: Install Docker on EC2 and Deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST6 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Configuración básica en la instancia
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker"
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker ec2-user
            fi
            # Detener y eliminar cualquier contenedor existente
            sudo docker stop inventory-realtime || true
            sudo docker rm inventory-realtime || true
            # Descargar la nueva imagen desde Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest
            # Ejecutar el contenedor en el puerto 80
            sudo docker run -d \
              --name inventory-realtime \
              -p 80:${{ secrets.PORT6 }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e DYNAMODB_TABLE=${{ secrets.DYNAMODB_TABLE }} \
              -e PORT=${{ secrets.PORT6 }} \
              ${{ secrets.DOCKER_USERNAME }}/inventory-realtime:latest
