name: Build, Push, and Deploy Docker Image listUser$

on:
  push:
    branches:
      - feat/user-management

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build listUsers Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/listUsers:latest ./User_management/backend/listUsers

      - name: Push listUsers Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/listUsers:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-34-239-106-76.compute-1.amazonaws.com << 'EOF'
            if ! command -v docker &> /dev/null
            then
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/listUsers:latest
            sudo docker stop $(sudo docker ps -q)
            sudo docker rm -f $(sudo docker ps -aq)
            sudo docker run -d -p 4567:4567 ${{ secrets.DOCKER_USERNAME }}/listUsers:latest
          EOF
 
